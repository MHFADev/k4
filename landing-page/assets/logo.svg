<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#gradient)" filter="url(#shadow)"/>
  
  <!-- K Letter -->
  <text x="50" y="60" font-family="Poppins, sans-serif" font-size="40" font-weight="700" fill="white" text-anchor="middle">K4</text>
  
  <!-- Coin circles -->
  <circle cx="25" cy="75" r="8" fill="#FCD34D" opacity="0.8"/>
  <circle cx="40" cy="78" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="75" cy="25" r="8" fill="#10B981" opacity="0.6"/>
  <circle cx="85" cy="35" r="5" fill="#34D399" opacity="0.6"/>
</svg>
